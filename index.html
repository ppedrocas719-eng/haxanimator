<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Script</title>
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #5b6784;
    --accent: #fca311;
    --code-bg: #14213d;
    --code-ink: #e7ecf7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1424;
      --surface: #16203a;
      --ink: #eef1f6;
      --muted: #9aa6c4;
      --code-bg: #0a0f1d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 2rem; line-height: 1.1; margin: 8px 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 0 16px; color: var(--muted); }
  .card {
    background: var(--surface);
    border-radius: 14px;
    padding: 18px;
    margin-top: 20px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 10px; }
  pre {
    margin: 0 0 14px;
    padding: 14px;
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: 8px;
    overflow-x: auto;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    white-space: pre;
  }
  button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 14px;
    font: inherit;
    font-weight: 700;
    color: #14213d;
    background: var(--accent);
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  ol { margin: 0; padding-left: 20px; color: var(--muted); }
  ol li { margin-bottom: 6px; }
  .status { min-height: 1.4em; margin: 10px 0 0; font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Meu Script</h1>
  <p>Copie o loadstring abaixo e execute no Delta.</p>

  <section class="card">
    <h2>Loadstring</h2>
    <pre id="code"></pre>
    <button id="copy" type="button">Copiar loadstring</button>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="card">
    <h2>Como usar</h2>
    <ol>
      <li>Toque em Copiar loadstring.</li>
      <li>Abra o Roblox e o Delta.</li>
      <li>Cole na aba de scripts e toque em Execute.</li>
    </ol>
  </section>
</main>

<script>
  // Troque pelo link raw do seu script.lua no GitHub
  var RAW = "https://raw.githubusercontent.com/ppedrocas719-eng/haxanimator/main/script.lua";

  var loader = 'loadstring(game:HttpGet("' + RAW + '"))()';
  var codeEl = document.getElementById("code");
  var statusEl = document.getElementById("status");
  codeEl.textContent = loader;

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  document.getElementById("copy").addEventListener("click", function () {
    function done(ok) {
      statusEl.textContent = ok ? "Copiado." : "Não foi possível copiar. Selecione o texto e copie manualmente.";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(loader).then(function () { done(true); }, function () { done(fallbackCopy(loader)); });
    } else {
      done(fallbackCopy(loader));
    }
  });
</script>
</body>
</html>
